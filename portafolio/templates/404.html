<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>404 - Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { text-align: center; padding: 40px; border-radius: 20px; background: white; shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .error-code { font-size: 100px; font-weight: bold; color: #0d6efd; line-height: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 error-card shadow">
                <div class="error-code">404</div>
                <h2 class="fw-bold mt-3">¡Ups! Página no encontrada</h2>
                <p class="text-muted mb-4">Parece que la página que buscas no existe o ha sido movida.</p>
                <a href="/" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">
                    <i class="bi bi-house-door me-2"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
